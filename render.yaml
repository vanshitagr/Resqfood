# Render blueprint. Push this repo, then Render -> New -> Blueprint and point it here.
#
# Uses the native Node runtime rather than the Dockerfile, because it is faster to build and
# needs no container registry. The Dockerfile is still there for Railway, Fly.io or any host
# that prefers a container.
services:
  - type: web
    name: resqfood
    runtime: node
    plan: free
    region: singapore # same region as the Supabase project (ap-southeast-1) to keep latency low

    buildCommand: npm ci --omit=dev
    # Run node directly so SIGTERM reaches the process and the database pool closes cleanly.
    startCommand: node server/index.js

    # Render restarts the instance if this stops returning 200.
    healthCheckPath: /api/health

    envVars:
      # node:sqlite and --env-file-if-exists both require Node 22+.
      - key: NODE_VERSION
        value: 22.11.0

      # Enables secure cookies and HSTS, and makes a missing JWT_SECRET a hard start-up error.
      - key: NODE_ENV
        value: production

      # Generated by Render and never shown in the repo. Rotating it logs everyone out.
      - key: JWT_SECRET
        generateValue: true

      # ---- set these in the Render dashboard (sync: false = not stored in this file) ----

      # REQUIRED. The free plan has an ephemeral filesystem, so SQLite would be wiped on every
      # restart and redeploy. Use the Supabase session pooler:
      #   postgresql://postgres.<PROJECT_REF>:<PASSWORD>@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false

      # Optional - Google sign-in. GOOGLE_REDIRECT_URI must match the Google console entry
      # exactly, e.g. https://resqfood.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Optional - AI donation parser. Without it the local rule-based parser is used.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Optional - outbound notifications. In-app notifications work without any of these.
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

      # Used to build deep links inside notification emails.
      - key: PUBLIC_URL
        sync: false
